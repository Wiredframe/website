<!DOCTYPE html>
<html lang="de">
<!-- Weiterleitung, gleiches Muster wie impressum.html.
     Datenschutz und Nutzungsbedingungen stehen seit dem Zusammenführen nur noch
     im Deck der Startseite unter /#impressum. Diese Datei bleibt bestehen, weil
     ihre Adresse in den App-Store-Einträgen als Datenschutz-URL hinterlegt ist
     und dort nicht ins Leere laufen darf. Zeigen die Einträge irgendwann direkt
     auf /#impressum, kann sie weg.

     GitHub Pages kann keine 301 ausliefern, deshalb der Umweg über
     meta refresh. Das rel=canonical zeigt Suchmaschinen das eigentliche Ziel,
     der sichtbare Link fängt alles ab, was weder Weiterleitung noch Skript
     ausführt. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/#impressum">
<link rel="canonical" href="https://www.wiredframe.de/#impressum">
<meta name="robots" content="noindex, follow">
<title>Datenschutz &amp; Nutzungsbedingungen | wiredframe</title>
<link rel="shortcut icon" href="images/shortcut-icon.svg" type="image/x-icon">
<meta name="theme-color" content="#e2ebe6">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#e2ebe6; color:#193239; text-align:center; padding:24px;
        font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:#193239; }
</style>
</head>
<body>
<p>Datenschutz und Nutzungsbedingungen stehen jetzt auf der Startseite.<br>
  <a href="/#impressum">Weiter zu Datenschutz und Nutzungsbedingungen</a></p>
<script>location.replace('/#impressum');</script>
</body>
</html>
