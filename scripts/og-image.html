<!doctype html>
<html lang="de">

<head>
	<meta charset="utf-8">
	<!-- Vorlage für images/og-image.png, gerendert von scripts/build-og-image.sh.
	     Nicht Teil der Seite: liegt in scripts/ und wird nie ausgeliefert.
	     Farben und Schriften kommen aus css/deck.css, das Signet aus index.html.
	     Ändert sich dort etwas, hier nachziehen und das Skript erneut laufen lassen. -->
	<style>
		@font-face {
			font-family: 'Brawler';
			font-weight: 400 700;
			src: url('../fonts/Brawler-variable.woff2') format('woff2');
		}

		@font-face {
			font-family: 'Onest';
			font-weight: 100 900;
			src: url('../fonts/Onest-latin.woff2') format('woff2');
		}

		:root {
			--color-primary: #193239;
			--color-accent: #beff8a;
			--color-ink: #2b493d;
			--color-canvas: #e2ebe6;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		body {
			width: 1200px;
			height: 630px;
			background: var(--color-canvas);
			color: var(--color-primary);
			font-family: 'Onest', system-ui, sans-serif;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 72px 80px;
			box-sizing: border-box;
		}

		.signet {
			width: 104px;
			height: 104px;
			display: block;
			overflow: visible;
		}

		/* Dieselbe Rollenverteilung wie auf der Startseite, nur ohne Animation:
		   Teil 1 liegt in der Grundfläche, 2 und 4 dunkel, 3 im Akzent. */
		.teil--1 { fill: var(--color-canvas); }
		.teil--2,
		.teil--4 { fill: var(--color-primary); }
		.teil--3 { fill: var(--color-accent); }
		.signet path { stroke: var(--color-primary); stroke-width: 0.5; }

		h1 {
			font-family: 'Brawler', Georgia, serif;
			font-weight: 700;
			font-size: 88px;
			line-height: 1.05;
			letter-spacing: -0.015em;
			margin: 0 0 18px;
		}

		.claim {
			font-size: 38px;
			line-height: 1.3;
			font-weight: 500;
			color: var(--color-ink);
			margin: 0;
			max-width: 26ch;
		}

		/* Der Begriff darf nicht umbrechen: die Auszeichnung liefe sonst
		   über zwei Zeilen und zerschnitte den Namen. */
		.claim b {
			font-weight: 500;
			white-space: nowrap;
			background: linear-gradient(transparent 62%, var(--color-accent) 62%);
		}

		footer {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			font-size: 24px;
			color: var(--color-ink);
		}

		footer .adresse {
			font-weight: 600;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			font-size: 21px;
		}
	</style>
</head>
